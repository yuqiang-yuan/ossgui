name: Package

# 只在手动触发。不做"推 tag 自动发版"，需要的时候自己来点。
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux 用 22.04 而不是 24.04：产物会带上构建机的 glibc 符号版本
  # （rpm 的 requires 里能看到 libm.so.6(GLIBC_2.43) 这种），
  # 在 24.04 上构建出来的包只能装在 24.04+。
  linux-x64:
    name: Linux x64 (deb / rpm / AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # linuxdeploy 是 AppImage 形式分发的，挂载需要 FUSE
      - name: 安装 AppImage 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: 安装打包工具
        run: |
          cargo install cargo-packager --locked
          cargo install cargo-generate-rpm --locked

      - name: 构建
        run: cargo build --release

      - name: 打包 deb + AppImage
        run: cargo packager --release --formats deb,appimage

      - name: 打包 rpm
        run: cargo generate-rpm -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64 (deb / rpm / AppImage)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 AppImage 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: 安装打包工具
        run: |
          cargo install cargo-packager --locked
          cargo install cargo-generate-rpm --locked

      - name: 构建
        run: cargo build --release

      - name: 打包 deb + AppImage
        run: cargo packager --release --formats deb,appimage

      - name: 打包 rpm
        run: cargo generate-rpm -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 (dmg)
    # macos-14 起都是 Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装打包工具
        run: cargo install cargo-packager --locked

      # 目前不签名。dmg 里的 .app 是未签名的，用户第一次打开会被 Gatekeeper
      # 拦住，需要右键 → 打开（README 里写了）。
      #
      # 以后有 Apple Developer 账号了，在 cargo packager 之前加一步导入证书
      # 和 notarytool 公证，需要的 secrets：
      #   APPLE_CERTIFICATE       Developer ID Application 证书（base64 的 .p12）
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_TEAM_ID
      #   APPLE_API_KEY           App Store Connect API Key（.p8，base64）
      #   APPLE_API_KEY_ID
      #   APPLE_API_ISSUER_ID
      - name: 打包 dmg
        run: cargo packager --release --formats dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows x64 (免安装 exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 这里不用 cargo-packager：它只出 NSIS/MSI 安装程序，
      # 而我们要的是免安装单文件。图标和 manifest 由 build.rs 嵌进 exe，
      # CRT 静态链接由 .cargo/config.toml 的 +crt-static 保证，
      # 所以 target/release/ossgui.exe 本身就是最终产物。
      - name: 构建
        run: cargo build --release

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ossgui.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error
