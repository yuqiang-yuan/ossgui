name: Package

# 只在手动触发。不做"推 tag 自动发版"，需要的时候自己来点。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布成 GitHub Release 用的 tag，例如 v0.1.0。留空则只构建，不发布'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux 用 22.04 而不是 24.04：产物会带上构建机的 glibc 符号版本
  # （rpm 的 requires 里能看到 libm.so.6(GLIBC_2.43) 这种），
  # 在 24.04 上构建出来的包只能装在 24.04+。
  linux-x64:
    name: Linux x64 (deb / rpm / AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装系统依赖
        run: |
          sudo apt-get update

          # GPUI 在 Linux 上要链接这几个库。runner 镜像里带了运行时（libxkbcommon0
          # 这种）但没带 -dev 包，缺的是 .so 软链接，链接期会报
          # "cannot find -lxkbcommon"。本机开发时因为装过开发包所以不会遇到。
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev

          # linuxdeploy 是 AppImage 形式分发的，挂载需要 FUSE
          sudo apt-get install -y libfuse2

      - name: 安装打包工具
        run: |
          cargo install cargo-packager --locked
          cargo install cargo-generate-rpm --locked

      - name: 构建
        run: cargo build --release

      - name: 打包 deb + AppImage
        run: cargo packager --release --formats deb,appimage

      - name: 打包 rpm
        run: cargo generate-rpm -o dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64 (deb / rpm / AppImage)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装系统依赖
        run: |
          sudo apt-get update

          # GPUI 在 Linux 上要链接这几个库。runner 镜像里带了运行时（libxkbcommon0
          # 这种）但没带 -dev 包，缺的是 .so 软链接，链接期会报
          # "cannot find -lxkbcommon"。本机开发时因为装过开发包所以不会遇到。
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev

          # linuxdeploy 是 AppImage 形式分发的，挂载需要 FUSE
          sudo apt-get install -y libfuse2

      - name: 安装打包工具
        run: |
          cargo install cargo-packager --locked
          cargo install cargo-generate-rpm --locked

      - name: 构建
        run: cargo build --release

      - name: 打包 deb + AppImage
        run: cargo packager --release --formats deb,appimage

      - name: 打包 rpm
        run: cargo generate-rpm -o dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 (dmg)
    # macos-14 起都是 Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装打包工具
        run: cargo install cargo-packager --locked

      - name: 导入签名证书到临时 keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # CI runner 上没有你的 login keychain，codesign 默认搜不到证书，
          # 所以建一个临时 keychain，把 .p12 导进去，再塞到搜索列表最前面。
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          KEYCHAIN="cargo-packager.keychain-db"
          # 随机密码，反正 CI 跑完就删
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 别让它自动锁住，否则签名中途会卡
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # 把临时 keychain 加到搜索列表（-s 是整体替换，所以把默认的 login 一起带上）
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # 给 codesign 这类进程授权读 key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      # signingIdentity 在 Cargo.toml 的 [package.metadata.packager.macos] 里。
      # cargo-packager 用它调 codesign：--options runtime（hardened runtime，公证
      # 必需）+ --timestamp（可信时间戳）。这里不设 notarytool 相关的环境变量，
      # 所以 cargo-packager 只签名、不公证——公证我们对最终的 .dmg 单独做，这样
      # 能直接 staple 到 dmg 上，用户下载下来 Gatekeeper 一路放行。
      - name: 打包并签名 dmg
        run: cargo packager --release --formats dmg

      - name: 公证并 staple dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # App Store Connect API Key 的 .p8，存 secret 时是 base64，这里解成文件。
          echo "$APPLE_API_KEY" | base64 --decode > AuthKey.p8

          DMG="$(ls dist/*.dmg)"
          # --wait 会一直等到 Apple 审完；审不过这里直接非 0 退出，job 变红。
          xcrun notarytool submit "$DMG" \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: 清理临时 keychain
        if: always()
        run: security delete-keychain cargo-packager.keychain-db 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows x64 (免安装 exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 这里不用 cargo-packager：它只出 NSIS/MSI 安装程序，
      # 而我们要的是免安装单文件。图标和 manifest 由 build.rs 嵌进 exe，
      # CRT 静态链接由 .cargo/config.toml 的 +crt-static 保证，
      # 所以 target/release/ossgui.exe 本身就是最终产物。
      - name: 构建
        run: cargo build --release

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ossgui.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  # 把四个 job 的产物汇总成一个 GitHub Release。
  #
  # workflow_dispatch 的 release_tag 留空时整个 job 跳过 —— 平时就是纯构建，
  # 想发版才填 tag。
  release:
    name: 发布 Release
    needs: [linux-x64, linux-arm64, macos-arm64, windows-x64]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release 要写权限。仓库默认给的 GITHUB_TOKEN 是只读的，
      # 不显式提权会在最后一步 403。
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # 把四个 artifact 解到同一个目录，而不是各自的子目录
          merge-multiple: true

      - name: 整理产物文件名
        # 用 env 而不是直接把 ${{ }} 插进脚本里，避免输入被当成 shell 代码执行
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd dist
          ls -la

          # deb / rpm / AppImage / dmg 的文件名里本来就带架构，能看出平台。
          # 只有 exe 叫 ossgui.exe，从 Release 页面下载时看不出是什么，
          # 所以给它补上版本和平台。
          mv ossgui.exe "ossgui-${RELEASE_TAG}-windows-x64.exe"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          # 从上次 tag 以来的 commit 自动生成更新说明
          generate_release_notes: true
          # 先存成草稿：Release 一旦公开就会被镜像和索引，发之前自己看一眼
          # 产物齐不齐。确认没问题在页面上点 Publish 就行。
          draft: true
